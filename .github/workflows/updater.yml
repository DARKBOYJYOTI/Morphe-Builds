name: Build Updater App

on:
  push:
    paths:
      - "updater/**"
      - ".github/workflows/updater.yml"
      - ".github/scripts/gen_manifest.py"
  pull_request:
    paths:
      - "updater/**"
      - ".github/workflows/updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    outputs:
      signing_enabled: ${{ steps.signing.outputs.enabled }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Version info
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.UPDATER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/updater.keystore"
            echo "release signing key is available"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::UPDATER_KEYSTORE_BASE64 is not set; the build will use debug signing and cannot update itself"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: updater
        env:
          UPDATER_VERSION_CODE: ${{ steps.version.outputs.code }}
          UPDATER_VERSION_NAME: ${{ steps.version.outputs.name }}
          UPDATER_KEYSTORE_PATH: ${{ runner.temp }}/updater.keystore
          UPDATER_KEYSTORE_PASSWORD: ${{ secrets.UPDATER_KEYSTORE_PASSWORD }}
          UPDATER_KEY_ALIAS: ${{ secrets.UPDATER_KEY_ALIAS }}
          UPDATER_KEY_PASSWORD: ${{ secrets.UPDATER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace lintRelease testReleaseUnitTest assembleRelease

      - name: Show output
        working-directory: updater
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: morphe-builds-updater-${{ github.run_number }}
          path: updater/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: >-
      needs.build.outputs.signing_enabled == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: morphe-builds-updater-${{ github.run_number }}
          path: ${{ runner.temp }}/updater

      - name: Publish stable updater release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$RUNNER_TEMP/updater/app-release.apk"
          cp "$APK" "$RUNNER_TEMP/morphe-builds-updater.apk"
          if gh release view updater-latest >/dev/null 2>&1; then
            gh release upload updater-latest "$RUNNER_TEMP/morphe-builds-updater.apk" \
              --clobber
          else
            gh release create updater-latest "$RUNNER_TEMP/morphe-builds-updater.apk" \
              --title "Morphe Builds Updater" \
              --notes "Latest companion app build." \
              --prerelease
          fi
